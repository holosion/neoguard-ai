services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neoguard}
      POSTGRES_USER: ${POSTGRES_USER:-neoguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - neoguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neoguard} -d ${POSTGRES_DB:-neoguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neoguard_postgres_data:
